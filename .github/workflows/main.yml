name: Deploy Go Backend to Windows Server

on:
  pull_request_target:
    branches:
      - staging
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH Key (check length only)
        run: |
          echo "Key length: $(echo "${{ secrets.SERVER_SSH_KEY }}" | wc -c)"
          echo "First line:"
          echo "${{ secrets.SERVER_SSH_KEY }}" | head -n 1
          echo "Last line:"
          echo "${{ secrets.SERVER_SSH_KEY }}" | tail -n 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "✅ SSH connected!"
            bash /usr/local/bin/deploy_mini.sh
