name: Deploy Go Backend to Windows Server

on:
  pull_request_target:
    branches: [staging]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH key length (secret có đang rỗng không)
        run: |
          echo "Key length: $(echo "${{ secrets.SERVER_SSH_KEY }}" | wc -c)"
          echo "First line:"; echo "${{ secrets.SERVER_SSH_KEY }}" | head -n 1
          echo "Last line:";  echo "${{ secrets.SERVER_SSH_KEY }}" | tail -n 1

      - name: Raw SSH test (bỏ qua action để test secret)
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo ✅ OK from server"

      - name: Deploy via SSH (appleboy)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "✅ SSH connected!"
            bash /usr/local/bin/deploy_mini.sh
